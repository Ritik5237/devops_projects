# TaskFlow Dynamic Infrastructure Inventory
[all:vars]
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3

[k8s_nodes]
taskflow-node-01 ansible_host=YOUR_TASKFLOW_NODE_PUBLIC_IP

[jenkins_controllers]
jenkins-server-01 ansible_host=YOUR_JENKINS_SERVER_PUBLIC_IP

[web_servers:children]
k8s_nodes

[ci_cd:children]
jenkins_controllers
