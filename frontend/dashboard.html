<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — TaskFlow</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Top Navigation -->
  <header class="navbar">
    <a href="/dashboard.html" class="brand">
      <span>⚡ TaskFlow</span>
      <span class="brand-badge">App</span>
    </a>
    <div class="nav-links">
      <span style="font-size: 0.9rem; color: var(--text-muted);">
        👤 <strong id="user-name-display" style="color: var(--text-main);">User</strong>
      </span>
      <button id="logout-btn" class="btn btn-secondary btn-sm">Sign Out</button>
    </div>
  </header>

  <main class="dashboard-container">
    <!-- Quick Statistics -->
    <section class="stats-grid">
      <div class="glass-panel stat-card">
        <div class="stat-icon total">📋</div>
        <div class="stat-info">
          <h3 id="stat-total">0</h3>
          <p>Total Tasks</p>
        </div>
      </div>

      <div class="glass-panel stat-card">
        <div class="stat-icon pending">⏳</div>
        <div class="stat-info">
          <h3 id="stat-pending">0</h3>
          <p>Pending</p>
        </div>
      </div>

      <div class="glass-panel stat-card">
        <div class="stat-icon in-progress">⚡</div>
        <div class="stat-info">
          <h3 id="stat-in-progress">0</h3>
          <p>In Progress</p>
        </div>
      </div>

      <div class="glass-panel stat-card">
        <div class="stat-icon completed">✅</div>
        <div class="stat-info">
          <h3 id="stat-completed">0</h3>
          <p>Completed</p>
        </div>
      </div>
    </section>

    <!-- Toolbar: Search, Filters & Action -->
    <section class="glass-panel controls-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="search-input" 
          class="form-control" 
          placeholder="Search tasks by title or details..."
        >
      </div>

      <div class="filter-group">
        <select id="filter-status" class="filter-select">
          <option value="All">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>

        <select id="filter-priority" class="filter-select">
          <option value="All">All Priorities</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>

        <select id="filter-sort" class="filter-select">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="dueDate">Due Date</option>
        </select>

        <button class="btn btn-primary" onclick="openTaskModal()">
          + Add Task
        </button>
      </div>
    </section>

    <!-- Task Cards Grid -->
    <section id="tasks-grid" class="tasks-grid">
      <!-- Populated via dashboard.js -->
    </section>
  </main>

  <!-- Create / Edit Task Modal -->
  <div class="modal-overlay" id="task-modal">
    <div class="glass-panel modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Create New Task</h3>
        <button class="close-btn" onclick="closeTaskModal()">&times;</button>
      </div>

      <form id="task-form">
        <div class="form-group">
          <label class="form-label" for="task-title-input">Task Title *</label>
          <input 
            type="text" 
            id="task-title-input" 
            class="form-control" 
            placeholder="e.g. Set up Jenkins pipeline" 
            required 
            maxlength="120"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="task-desc-input">Description</label>
          <textarea 
            id="task-desc-input" 
            class="form-control" 
            placeholder="Add relevant notes, acceptance criteria, or links..."
            rows="3"
            maxlength="1000"
          ></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="task-priority">Priority</label>
            <select id="task-priority" class="form-control">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="task-status">Status</label>
            <select id="task-status" class="form-control">
              <option value="Pending" selected>Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="task-due-date">Due Date</label>
          <input 
            type="date" 
            id="task-due-date" 
            class="form-control"
          >
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeTaskModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-task-btn">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
