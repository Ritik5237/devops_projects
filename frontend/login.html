<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — TaskFlow</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="/index.html" class="brand">
      <span>⚡ TaskFlow</span>
    </a>
    <nav class="nav-links">
      <a href="/register.html" class="nav-link">Need an account? Register</a>
    </nav>
  </header>

  <div class="auth-container">
    <div class="glass-panel auth-card">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Sign in to manage your tasks and pipeline</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="you@domain.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>

        <button type="button" id="fill-demo-btn" class="btn btn-secondary" style="width: 100%; margin-top: 0.75rem;">
          ⚡ Auto-fill Demo Account
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="/register.html" style="color: var(--accent-primary); font-weight: 600; text-decoration: none;">Register here</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
